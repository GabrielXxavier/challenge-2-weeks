<div id="book-delete">
    <h3>Confirmar Exclusão</h3>
    <p>Tem certeza que deseja excluir este livro  ? Esta ação não pode ser desfeita.</p>
    
    <div id="book-delete-actions">
         
         <p-button styleClass="p-button-secondary" id="book-register-confirmation" type="submit" (click)="DeleteBook()">Cancelar</p-button> 
         <p-button styleClass="p-button-danger"  (click)="onCancel()">Excluir</p-button>
    </div>    
</div>
